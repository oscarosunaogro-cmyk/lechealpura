const persist=()=>{try{localStorage.setItem(LS,JSON.stringify(rec))}catch(e){}};
const mig=r=>{for(const k of['cl','de']){if(!Array.isArray(r[k]))r[k]=[{lote:r[k+'Lote']??'',fec:r[k+'Fec']??'',pz:r[k+'Pz']??''}];['Lote','Fec','Pz','Cj'].forEach(x=>delete r[k+x])}return r};

const prod=(l,k,sy,r)=>`<div class="pr"><div class="pl">${l}<span>Sistema: ${sy[0]} pz</span></div>${(r[k]&&r[k].length?r[k]:[{}]).map((x,i)=>ln(k,i,x)).join('')}<button type="button" class="add" data-k="${k}">+ Agregar otro lote / vencimiento</button></div>`;
function card(s){const r=rec[s.id]||{},e=document.createElement('div');e.className='card'+(r.ok?' ok':'');e.dataset.id=s.id;

const gr=g.querySelector('.grid');D.filter(s=>s.r===r).forEach(s=>gr.append(card(s)));list.append(g);
$('#rg').insertAdjacentHTML('beforeend',`<option>${esc(r)}</option>`)});

if(!e.target.closest('.btn'))return;

r.ok=true;r.ts=new Date().toISOString();persist();redraw(id);upd();filt();toast('Tienda '+s.n+' guardada');

['#q','#zn','#st'].forEach(s=>$(s).addEventListener('input',filt));

if(db)db.collection(COL).onSnapshot(qs=>{qs.docChanges().forEach(ch=>{if(ch.type==='removed')return;const id=ch.doc.id;if(!M[id])return;
const a=document.activeElement;if(a&&a.closest&&a.closest('.card')?.dataset.id===id&&!ch.doc.metadata.hasPendingWrites)return;
rec[id]=mig(ch.doc.data());redraw(id)});persist();upd();filt();$('#st2').textContent='● En línea (Firebase)'},()=>{$('#st2').textContent='● Sin conexión: trabajando en local'});

$('#ex').addEventListener('click',()=>{const rows=[];
D.forEach(s=>[['LECHE ALPURA CLASICA 4 PACK 1 LT LMB','cl',s.c],['LECHE ALPURA DESLAC 4 PACK 1 LT LMB','de',s.d]].forEach(([a,k,sy])=>{const r=rec[s.id]||{},L=r.ok&&r[k]&&r[k].length?r[k]:[null];
L.forEach((x,i)=>rows.push({REGION:s.r,ZONA:s.z,'ID TIENDA':s.id,TIENDA:s.n,ARTICULO:a,'EXIST. SISTEMA PZ':i?'':sy[0],
LOTE:x?x.lote:'','FECHA VENCIMIENTO':x?x.fec:'','PZ VENC. OCTUBRE':x?x.pz:'',ESTATUS:r.ok?'CONFIRMADA':'PENDIENTE','FECHA CAPTURA':r.ts?new Date(r.ts).toLocaleString('es-MX'):''}))}));
if(!window.XLSX){toast('No cargó la librería de Excel (revisa conexión)');return}
const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Inventario');
XLSX.writeFile(wb,'existencias_octubre_'+new Date().toISOString().slice(0,10)+'.xlsx')});
upd();
</script></body></html>
